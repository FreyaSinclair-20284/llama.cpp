name: CI (cann)

# Upstream currently has every CANN job commented out. Keeping a push trigger
# with no jobs makes GitHub mark every commit as a failed/invalid workflow.
# On this fork, keep the placeholder valid and manual-only until upstream
# re-enables real CANN jobs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cann-disabled:
    name: CANN CI is currently disabled upstream
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: echo "CANN CI jobs are disabled upstream; nothing to build."
