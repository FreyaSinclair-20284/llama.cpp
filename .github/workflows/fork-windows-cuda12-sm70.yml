name: Fork - Windows CUDA 12.0 sm_70

on:
  # GitHub's "Sync fork -> Update branch" updates master, so every upstream
  # synchronization automatically starts this build.
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-windows-cuda12-sm70-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cuda12-sm70:
    name: Windows x64 / CUDA 12.0.0 / sm_70
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # CUDA 12.0 supports MSVC 193x. The current windows-2022 image defaults
      # to MSVC 19.44, whose STL explicitly requires CUDA 12.4 or newer.
      # Install the VS 2022 17.4 / MSVC 14.34 toolset and select it below.
      - name: Install MSVC v143 14.34 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $toolsetRoot = Join-Path $vsPath 'VC\Tools\MSVC'
          $toolset = Get-ChildItem $toolsetRoot -Directory -Filter '14.34.*' -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $toolset) {
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            if (-not (Test-Path $setup)) {
              throw "Visual Studio Installer not found: $setup"
            }

            $component = 'Microsoft.VisualStudio.Component.VC.14.34.17.4.x86.x64'
            $arguments = "modify --installPath `"$vsPath`" --add $component --quiet --norestart"
            Write-Host "Installing $component"
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
              throw "Visual Studio Installer failed with exit code $($process.ExitCode)"
            }

            $toolset = Get-ChildItem $toolsetRoot -Directory -Filter '14.34.*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              Select-Object -First 1
          }

          if (-not $toolset) {
            throw 'MSVC 14.34 toolset was not found after installation'
          }
          Write-Host "MSVC 14.34 toolset: $($toolset.FullName)"

      - name: Setup CUDA 12.0-compatible MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.34'
          sdk: '10.0.22621.0'

      - name: Install CUDA Toolkit 12.0.0
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.0.0'
          method: local

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          Write-Host "VCToolsInstallDir=$env:VCToolsInstallDir"
          Write-Host "WindowsSDKVersion=$env:WindowsSDKVersion"

          $nvccVersion = (& nvcc --version 2>&1 | Out-String)
          Write-Host $nvccVersion
          if ($nvccVersion -notmatch 'release 12\.0') {
            throw 'CUDA Toolkit 12.0 is not active'
          }

          $clVersion = (& cl 2>&1 | Out-String)
          Write-Host $clVersion
          if ($clVersion -notmatch 'Version 19\.34\.') {
            throw "Expected MSVC 19.34, but another compiler is active"
          }

          cmake --version
          ninja --version

      - name: Configure
        shell: pwsh
        run: |
          $cudaHostCompiler = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\cl.exe'
          if (-not (Test-Path $cudaHostCompiler)) {
            throw "CUDA host compiler not found: $cudaHostCompiler"
          }

          cmake -S . -B build -G "Ninja Multi-Config" `
            -DGGML_CUDA=ON `
            -DGGML_NATIVE=OFF `
            -DCMAKE_CUDA_ARCHITECTURES=70 `
            -DCMAKE_CUDA_HOST_COMPILER="$cudaHostCompiler" `
            -DCMAKE_SYSTEM_VERSION=10.0.22621.0 `
            -DLLAMA_CURL=OFF

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Verify sm_70 configuration
        shell: pwsh
        run: |
          Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_CUDA_ARCHITECTURES:.*=70$' | ForEach-Object { $_.Line }
          if (-not (Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_CUDA_ARCHITECTURES:.*=70$' -Quiet)) {
            throw 'CMAKE_CUDA_ARCHITECTURES is not set to 70'
          }

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          if (Test-Path build/bin/Release) {
            Copy-Item build/bin/Release/* artifact/ -Recurse -Force
          } elseif (Test-Path build/bin) {
            Copy-Item build/bin/* artifact/ -Recurse -Force
          } else {
            throw 'Build output directory was not found'
          }
          @(
            "llama.cpp fork build",
            "source commit: $env:GITHUB_SHA",
            "CUDA Toolkit: 12.0.0",
            "MSVC toolset: 14.34 / compiler 19.34",
            "Windows SDK: 10.0.22621.0",
            "CMAKE_CUDA_ARCHITECTURES: 70 (sm_70)",
            "runner: windows-2022 x64"
          ) | Set-Content artifact/BUILD-INFO.txt

      - name: Upload Windows CUDA 12 sm_70 binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-x64-cuda12.0-sm70-${{ github.sha }}
          path: artifact/**
          if-no-files-found: error
          retention-days: 30
