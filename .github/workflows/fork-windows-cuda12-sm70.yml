name: Fork - Windows CUDA 12.0 sm_70

on:
  # GitHub's "Sync fork -> Update branch" updates master, so every upstream
  # synchronization automatically starts this build.
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-windows-cuda12-sm70-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cuda12-sm70:
    name: Windows x64 / CUDA 12.0.0 / sm_70
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # CUDA 12.0 officially supports MSVC 192x and 193x. The current
      # windows-2022 default is MSVC 19.44, whose STL requires CUDA >= 12.4.
      # The runner already carries the v142 / MSVC 14.29 (compiler 19.29)
      # toolset, so select it instead of installing an old toolset every run.
      - name: Setup CUDA 12.0-compatible MSVC environment
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.29'
          sdk: '10.0.22621.0'

      - name: Install CUDA Toolkit 12.0.0 build components
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.0.0'
          method: network
          # Keep this aligned with what llama.cpp's Windows CUDA backend needs:
          # compiler/runtime, CUDA C++ headers (Thrust/CUB), cuBLAS, plus the
          # NVRTC/NVTX/VS integration pieces used by the normal Windows toolkit.
          # The network installer downloads only these components instead of
          # the entire multi-GB CUDA installer.
          sub-packages: '["nvcc", "cudart", "thrust", "cublas", "cublas_dev", "nvrtc", "nvrtc_dev", "nvtx", "visual_studio_integration"]'

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          Write-Host "VCToolsInstallDir=$env:VCToolsInstallDir"
          Write-Host "WindowsSDKVersion=$env:WindowsSDKVersion"

          $nvccVersion = (& nvcc --version 2>&1 | Out-String)
          Write-Host $nvccVersion
          if ($nvccVersion -notmatch 'release 12\.0') {
            throw 'CUDA Toolkit 12.0 is not active'
          }

          $clVersion = (& cl 2>&1 | Out-String)
          Write-Host $clVersion
          if ($clVersion -notmatch 'Version 19\.29\.') {
            throw 'Expected MSVC 19.29 (v142 / toolset 14.29), but another compiler is active'
          }

          $clPath = (Get-Command cl.exe).Source
          Write-Host "cl.exe=$clPath"
          if ($clPath -notmatch 'MSVC\\14\.29\.') {
            throw "cl.exe is not from the MSVC 14.29 toolset: $clPath"
          }

          cmake --version
          ninja --version

      - name: Configure
        shell: pwsh
        run: |
          # Do not pass CMAKE_CUDA_HOST_COMPILER as an absolute path here.
          # With Ninja + CUDA 12.0 on Windows, CMake's compiler-id invocation
          # can mangle a space-containing -ccbin path. The selected MSVC 14.29
          # Developer Command Prompt already puts the correct cl.exe first in PATH.
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DGGML_CUDA=ON `
            -DGGML_NATIVE=OFF `
            -DCMAKE_CUDA_ARCHITECTURES=70 `
            -DLLAMA_CURL=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_TOOLS=ON `
            -DLLAMA_BUILD_SERVER=ON

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Verify CUDA configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archLine = Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_CUDA_ARCHITECTURES:.*=70$'
          if (-not $archLine) {
            throw 'CMAKE_CUDA_ARCHITECTURES is not set to 70'
          }
          Write-Host $archLine.Line

          $hostLine = Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_CUDA_HOST_COMPILER:.*MSVC[/\\]14\.29\.' -ErrorAction SilentlyContinue
          if ($hostLine) {
            Write-Host $hostLine.Line
          } else {
            Write-Host 'CMAKE_CUDA_HOST_COMPILER is not cached explicitly; nvcc used cl.exe from the verified MSVC 14.29 environment.'
          }

      - name: Stage binaries and CUDA runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          if (Test-Path build/bin/Release) {
            Copy-Item build/bin/Release/* artifact/ -Recurse -Force
          } elseif (Test-Path build/bin) {
            Copy-Item build/bin/* artifact/ -Recurse -Force
          } else {
            throw 'Build output directory was not found'
          }

          # ggml-cuda.dll dynamically imports the CUDA runtime and cuBLAS DLLs.
          # Package them just like the upstream llama.cpp Windows CUDA release,
          # so the artifact does not require a full CUDA Toolkit installation.
          $cudaDirs = @(
            (Join-Path $env:CUDA_PATH 'bin'),
            (Join-Path $env:CUDA_PATH 'bin\x64'),
            (Join-Path $env:CUDA_PATH 'lib')
          ) | Where-Object { Test-Path $_ }

          foreach ($pattern in @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')) {
            $matches = @(
              foreach ($dir in $cudaDirs) {
                Get-ChildItem -Path $dir -Filter $pattern -File -ErrorAction SilentlyContinue
              }
            ) | Sort-Object FullName -Unique

            if (-not $matches) {
              throw "Required CUDA runtime DLL not found: $pattern"
            }

            foreach ($file in $matches) {
              Write-Host "Packaging CUDA runtime: $($file.FullName)"
              Copy-Item $file.FullName artifact/ -Force
            }
          }

          foreach ($pattern in @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')) {
            if (-not (Get-ChildItem artifact -Filter $pattern -File -ErrorAction SilentlyContinue)) {
              throw "CUDA runtime DLL was not staged: $pattern"
            }
          }

          @(
            "llama.cpp fork build",
            "source commit: $env:GITHUB_SHA",
            "CUDA Toolkit: 12.0.0",
            "CUDA runtime DLLs: bundled",
            "MSVC toolset: 14.29 / compiler 19.29",
            "CMAKE_CUDA_ARCHITECTURES: 70 (sm_70)",
            "runner: windows-2022 x64"
          ) | Set-Content artifact/BUILD-INFO.txt

      - name: Upload Windows CUDA 12 sm_70 binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-x64-cuda12.0-sm70-${{ github.sha }}
          path: artifact/**
          if-no-files-found: error
          retention-days: 30
